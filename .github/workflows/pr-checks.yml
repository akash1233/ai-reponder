name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test:ci
      env:
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY || 'test-key' }}
        
    - name: Check test coverage
      run: |
        npm run test:coverage
        echo "Coverage threshold check would go here"
        
    - name: Validate commit messages
      uses: wagoid/commitlint-github-action@v5
      with:
        configFile: '.commitlintrc.js'
      continue-on-error: true
      
    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        if grep -r "TODO\|FIXME" src/ --exclude-dir=node_modules; then
          echo "Found TODO/FIXME comments. Consider addressing them before merging."
        else
          echo "No TODO/FIXME comments found."
        fi
      continue-on-error: true
      
    - name: Check file sizes
      run: |
        echo "Checking for large files..."
        find . -type f -size +10M -not -path "./node_modules/*" -not -path "./.git/*" | head -10
      continue-on-error: true
