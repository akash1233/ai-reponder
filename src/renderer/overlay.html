<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Suggestions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: rgba(255, 255, 255, 0.95);
            --bg-secondary: rgba(248, 249, 250, 0.8);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-primary: #007aff;
            --accent-success: #34c759;
            --accent-error: #ff3b30;
            --border-primary: rgba(210, 210, 215, 0.6);
            --shadow-large: 0 20px 60px rgba(0, 0, 0, 0.2);
            --radius-large: 20px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        [data-theme="dark"] {
            --bg-primary: rgba(0, 0, 0, 0.95);
            --bg-secondary: rgba(28, 28, 30, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-primary: #0a84ff;
            --accent-success: #30d158;
            --accent-error: #ff453a;
            --border-primary: rgba(56, 56, 58, 0.6);
            --shadow-large: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-large);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'kern' 1;
            text-rendering: optimizeLegibility;
        }

        .overlay-container {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: #1a202c;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #718096;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #e53e3e;
        }

        .suggestions-content {
            flex: 1;
            overflow-y: auto;
            max-height: 200px;
        }

        .suggestion-item {
            background: rgba(247, 250, 252, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .suggestion-item:hover {
            background: rgba(237, 242, 247, 0.9);
            border-color: rgba(203, 213, 224, 0.8);
            transform: translateY(-1px);
        }

        .suggestion-text {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .suggestion-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 60px;
        }

        .btn-accept {
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white;
            box-shadow: 0 2px 8px rgba(56, 161, 105, 0.3);
        }

        .btn-accept:hover {
            background: linear-gradient(135deg, #2f855a, #276749);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.4);
        }

        .btn-ignore {
            background: rgba(226, 232, 240, 0.8);
            color: #4a5568;
        }

        .btn-ignore:hover {
            background: rgba(203, 213, 224, 0.9);
            transform: translateY(-1px);
        }

        .single-suggestion {
            background: linear-gradient(135deg, rgba(230, 255, 250, 0.9), rgba(204, 251, 241, 0.8));
            border: 1px solid rgba(129, 230, 217, 0.6);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: 600;
            color: #234e52;
            margin-bottom: 12px;
        }

        .suggestion-text {
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 16px;
            line-height: 1.5;
            padding: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(129, 230, 217, 0.3);
        }

        .suggestion-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .overall-title {
            font-size: 12px;
            font-weight: 600;
            color: #234e52;
            margin-bottom: 8px;
        }

        .overall-text {
            font-size: 13px;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .overall-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .no-suggestions {
            text-align: center;
            color: #718096;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="header">
            <h3 class="title">✨ AI Suggestions</h3>
            <button class="close-btn" onclick="closeOverlay()">×</button>
        </div>
        
        <div class="suggestions-content" id="suggestionsContent">
            <div class="no-suggestions">Loading suggestions...</div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function closeOverlay() {
            ipcRenderer.send('ignore-suggestion');
        }

        function acceptSuggestion(suggestion) {
            // Always go through main process to ensure history is updated
            console.log('Accepting suggestion:', suggestion);
            ipcRenderer.send('accept-suggestion', suggestion);
        }

        function applyIndividual(original, suggested) {
            // Always go through main process to ensure history is updated
            console.log('Applying individual suggestion:', { original, suggested });
            ipcRenderer.send('apply-individual', { original, suggested });
        }

        function ignoreSuggestion() {
            ipcRenderer.send('ignore-suggestion');
        }

        // Listen for suggestions from main process
        console.log('🔧 Setting up IPC listener for show-suggestions...');
        
        ipcRenderer.on('show-suggestions', (event, data) => {
            console.log('🎯 Overlay received data:');
            console.log('📝 Original text:', data.originalText);
            console.log('✨ Suggestions:', JSON.stringify(data.suggestions, null, 2));
            console.log('🔍 About to call displaySuggestions...');
            displaySuggestions(data.suggestions, data.originalText);
            console.log('✅ displaySuggestions called');
        });
        
        // Also listen for any IPC events to debug
        ipcRenderer.on('*', (event, ...args) => {
            console.log('📡 Overlay received IPC event:', event, args);
        });
        
        console.log('✅ IPC listeners set up');

        function displaySuggestions(suggestions, originalText) {
            console.log('🎨 Displaying suggestions:');
            console.log('📝 Original text:', originalText);
            console.log('✨ Suggestions object:', suggestions);
            console.log('🔍 Overall suggestion:', suggestions?.overallSuggestion);
            
            const container = document.getElementById('suggestionsContent');
            console.log('📦 Container element:', container);
            
            // Check if we have a valid suggestion
            if (!suggestions || !suggestions.overallSuggestion) {
                console.log('❌ No valid suggestions available');
                console.log('❌ Suggestions exists:', !!suggestions);
                console.log('❌ Overall suggestion exists:', !!suggestions?.overallSuggestion);
                container.innerHTML = '<div class="no-suggestions">No suggestions available</div>';
                return;
            }
            
            // Check if suggestion is different from original (but don't be too strict)
            if (suggestions.overallSuggestion === originalText) {
                console.log('⚠️ Suggestion same as original, showing anyway for testing');
            }
            
            console.log('✅ Valid suggestion found, proceeding to display...');

            // Display the suggestion
            const bestSuggestion = suggestions.overallSuggestion;
            const suggestionType = 'AI Suggestion';
            
            console.log('🎯 Final suggestion to display:', bestSuggestion);
            console.log('🏷️ Suggestion type:', suggestionType);
            
            // Create the suggestion element
            const suggestionDiv = document.createElement('div');
            suggestionDiv.className = 'single-suggestion';
            
            suggestionDiv.innerHTML = `
                <div class="suggestion-title">${suggestionType}</div>
                <div class="suggestion-text">${escapeHtml(bestSuggestion)}</div>
                <div class="suggestion-actions">
                    <button class="btn btn-accept" id="acceptBtn">
                        ✨ Copy
                    </button>
                    <button class="btn btn-ignore" id="ignoreBtn">
                        Ignore
                    </button>
                </div>
            `;
            
            // Add event listeners
            suggestionDiv.querySelector('#acceptBtn').addEventListener('click', () => {
                acceptSuggestion(bestSuggestion);
            });
            
            suggestionDiv.querySelector('#ignoreBtn').addEventListener('click', () => {
                ignoreSuggestion();
            });
            
            // Clear container and add the suggestion
            console.log('🧹 Clearing container...');
            container.innerHTML = '';
            console.log('➕ Adding suggestion element...');
            container.appendChild(suggestionDiv);
            console.log('✅ Suggestion displayed successfully!');
            
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }

        // Close on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeOverlay();
            }
        });
    </script>
</body>
</html>
