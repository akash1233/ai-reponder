<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Suggestions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: rgba(255, 255, 255, 0.98);
            --bg-secondary: rgba(248, 249, 250, 0.9);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-primary: #007aff;
            --accent-success: #34c759;
            --accent-error: #ff3b30;
            --border-primary: rgba(210, 210, 215, 0.4);
            --shadow-large: 0 8px 32px rgba(0, 0, 0, 0.12);
            --radius-large: 16px;
            --spacing-md: 16px;
            --spacing-lg: 20px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: rgba(0, 0, 0, 0.95);
            --bg-secondary: rgba(28, 28, 30, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-primary: #0a84ff;
            --accent-success: #30d158;
            --accent-error: #ff453a;
            --border-primary: rgba(56, 56, 58, 0.6);
            --shadow-large: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow-large);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'kern' 1;
            text-rendering: optimizeLegibility;
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            transition: all var(--transition-smooth);
            will-change: opacity, transform;
        }

        body.animate-in {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        body.animate-out {
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
        }

        .overlay-container {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: #1a202c;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #718096;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #e53e3e;
        }

        .suggestions-content {
            flex: 1;
            overflow-y: auto;
            max-height: 200px;
        }

        .suggestion-item {
            background: rgba(247, 250, 252, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .suggestion-item:hover {
            background: rgba(237, 242, 247, 0.9);
            border-color: rgba(203, 213, 224, 0.8);
            transform: translateY(-1px);
        }

        .suggestion-text {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .suggestion-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-width: 70px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left var(--transition-fast);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-accept {
            background: linear-gradient(135deg, #38a169, #2f855a);
            color: white;
            box-shadow: 0 2px 8px rgba(56, 161, 105, 0.3);
        }

        .btn-accept:hover {
            background: linear-gradient(135deg, #2f855a, #276749);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.4);
        }

        .btn-ignore {
            background: rgba(226, 232, 240, 0.8);
            color: #4a5568;
        }

        .btn-ignore:hover {
            background: rgba(203, 213, 224, 0.9);
            transform: translateY(-1px);
        }

        .single-suggestion {
            background: linear-gradient(135deg, rgba(230, 255, 250, 0.9), rgba(204, 251, 241, 0.8));
            border: 1px solid rgba(129, 230, 217, 0.6);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .suggestion-title {
            font-size: 14px;
            font-weight: 600;
            color: #234e52;
            margin-bottom: 12px;
        }

        .suggestion-text {
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 16px;
            line-height: 1.5;
            padding: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            border: 1px solid rgba(129, 230, 217, 0.3);
        }

        .suggestion-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .overall-title {
            font-size: 12px;
            font-weight: 600;
            color: #234e52;
            margin-bottom: 8px;
        }

        .overall-text {
            font-size: 13px;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .overall-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .no-suggestions {
            text-align: center;
            color: #718096;
            font-size: 13px;
            padding: 20px;
        }

        .loading-skeleton {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
        }

        .skeleton-line {
            height: 16px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }
        .skeleton-line.long { width: 100%; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .fade-in {
            animation: fadeIn var(--transition-smooth) ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="header">
            <h3 class="title">✨ AI Suggestions</h3>
            <button class="close-btn" onclick="closeOverlay()">×</button>
        </div>
        
        <div class="suggestions-content" id="suggestionsContent">
            <div class="loading-skeleton">
                <div class="skeleton-line short"></div>
                <div class="skeleton-line medium"></div>
                <div class="skeleton-line long"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Performance optimizations
        const container = document.getElementById('suggestionsContent');
        let isAnimating = false;

        function closeOverlay() {
            if (isAnimating) return;
            ipcRenderer.send('ignore-suggestion');
        }

        function acceptSuggestion(suggestion) {
            if (isAnimating) return;
            ipcRenderer.send('accept-suggestion', suggestion);
        }

        function applyIndividual(original, suggested) {
            if (isAnimating) return;
            ipcRenderer.send('apply-individual', { original, suggested });
        }

        function ignoreSuggestion() {
            if (isAnimating) return;
            ipcRenderer.send('ignore-suggestion');
        }

        // Animation handlers
        ipcRenderer.on('animate-in', () => {
            document.body.classList.add('animate-in');
        });

        ipcRenderer.on('animate-out', () => {
            document.body.classList.add('animate-out');
        });

        // Main suggestions handler
        ipcRenderer.on('show-suggestions', (event, data) => {
            displaySuggestions(data.suggestions, data.originalText);
        });

        function displaySuggestions(suggestions, originalText) {
            if (isAnimating) return;
            
            // Check if we have a valid suggestion
            if (!suggestions || !suggestions.overallSuggestion) {
                container.innerHTML = '<div class="no-suggestions">No suggestions available</div>';
                return;
            }

            const bestSuggestion = suggestions.overallSuggestion;
            const suggestionType = 'AI Suggestion';
            
            // Create the suggestion element with optimized HTML
            const suggestionDiv = document.createElement('div');
            suggestionDiv.className = 'single-suggestion fade-in';
            
            suggestionDiv.innerHTML = `
                <div class="suggestion-title">${suggestionType}</div>
                <div class="suggestion-text">${escapeHtml(bestSuggestion)}</div>
                <div class="suggestion-actions">
                    <button class="btn btn-accept" data-action="accept">
                        ✨ Copy
                    </button>
                    <button class="btn btn-ignore" data-action="ignore">
                        Ignore
                    </button>
                </div>
            `;
            
            // Use event delegation for better performance
            suggestionDiv.addEventListener('click', (e) => {
                const action = e.target.dataset.action;
                if (action === 'accept') {
                    acceptSuggestion(bestSuggestion);
                } else if (action === 'ignore') {
                    ignoreSuggestion();
                }
            });
            
            // Clear container and add the suggestion
            container.innerHTML = '';
            container.appendChild(suggestionDiv);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeOverlay();
            } else if (e.key === 'Enter' && e.metaKey) {
                // Cmd+Enter to accept suggestion
                const acceptBtn = document.querySelector('[data-action="accept"]');
                if (acceptBtn) acceptBtn.click();
            }
        });

        // Initialize animation state
        document.addEventListener('DOMContentLoaded', () => {
            // Trigger initial animation after a short delay
            setTimeout(() => {
                document.body.classList.add('animate-in');
            }, 50);
        });
    </script>
</body>
</html>
